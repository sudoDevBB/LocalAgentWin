<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unlock Soundroom</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="login-page">
  <main class="login-panel">
    <p class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4a8 8 0 0 0-8 8v5.2c0 1.7-.6 3.3-1.7 4.5L5 24h22l-1.3-2.3a8.7 8.7 0 0 1-1.7-4.5V12a8 8 0 0 0-8-8Z"/><path d="M12.5 27a3.8 3.8 0 0 0 7 0"/></svg> Soundroom</p>
    <h1>Connect to your sound system</h1>
    <p>Enter the access PIN shown in the Soundroom window on the Windows computer.</p>
    <form method="post" action="{{ url_for('login_post') }}">
      <label for="pin">Local access PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <button type="submit">Open Soundroom</button>
    </form>
    <p class="quiet-note">This PIN is generated on the Windows computer and stays on your local network.</p>
  </main>
</body>
</html>
